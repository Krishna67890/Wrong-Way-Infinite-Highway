ext {
    compileSdkVersion = 37
    targetSdkVersion = 37
    minSdkVersion = 25
    androidxAppCompatVersion = '1.7.1'
    cordovaAndroidVersion = '14.0.1'
}

buildscript {
    ext {
        compileSdkVersion = 37
        targetSdkVersion = 37
        minSdkVersion = 25
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

allprojects {
    ext {
        compileSdkVersion = 37
        targetSdkVersion = 37
        minSdkVersion = 25
    }
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
